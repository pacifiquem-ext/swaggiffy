components:
  schemas:
    User:
      type: object
      properties:
        name:
          type: string
          example: string
          maxLength: 255
          minLength: 1
        email:
          type: string
          example: string
          maxLength: 255
        password:
          type: string
          example: string
        createdAt:
          type: string
          format: date
          example: 8/21/2026, 4:33:50 PM
          default: now()
          nullable: true
        _id:
          type: string
          example: 507f1f77bcf86cd799439011
          nullable: true
      required:
        - name
        - email
        - password
    Post:
      type: object
      properties:
        title:
          type: string
          example: string
          maxLength: 200
          minLength: 1
        content:
          type: string
          example: string
        author:
          type: string
          example: 507f1f77bcf86cd799439011
          description: Reference to User
          x-references: User
        tags:
          type: array
          nullable: true
          items:
            type: string
        published:
          type: boolean
          example: false
          default: false
          nullable: true
        createdAt:
          type: string
          format: date
          example: 8/21/2026, 4:33:50 PM
          default: now()
          nullable: true
        updatedAt:
          type: string
          format: date
          example: 8/21/2026, 4:33:50 PM
          default: now()
          nullable: true
        _id:
          type: string
          example: 507f1f77bcf86cd799439011
          nullable: true
      required:
        - title
        - content
        - author
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
